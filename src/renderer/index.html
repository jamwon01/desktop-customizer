<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Desktop Customizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 투명 레이어: 아이콘들이 배치되는 컨테이너 -->
  <div id="icon-layer"></div>

  <!-- 아이콘 편집 모달 -->
  <div id="modal-backdrop" class="hidden">
    <div id="modal" class="interactive">
      <h2>아이콘 편집</h2>

      <div class="field">
        <label>이름</label>
        <input type="text" id="f-name" />
      </div>

      <div class="field">
        <label>이미지</label>
        <div class="image-row">
          <div id="f-image-preview"></div>
          <button id="f-image-pick">이미지 변경</button>
        </div>
      </div>

      <div class="field">
        <label>실행 대상</label>
        <input type="text" id="f-target" placeholder="exe / 폴더 경로 또는 URL" />
      </div>

      <div class="field">
        <label>대상 종류</label>
        <select id="f-target-type">
          <option value="exe">프로그램 (exe)</option>
          <option value="folder">폴더</option>
          <option value="url">URL</option>
        </select>
      </div>

      <div class="field">
        <label>아이콘 크기 (px)</label>
        <input type="number" id="f-size" min="32" max="256" step="8" />
      </div>

      <div class="modal-buttons">
        <button id="btn-delete" class="danger">삭제</button>
        <span class="spacer"></span>
        <button id="btn-cancel">취소</button>
        <button id="btn-save" class="primary">저장</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
