<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Desktop Customizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 배경 레이어 (최하단, 클릭 통과) -->
  <div id="background"></div>

  <!-- 투명 레이어: 아이콘들이 배치되는 컨테이너 -->
  <div id="icon-layer"></div>

  <!-- 우클릭 컨텍스트 메뉴 -->
  <div id="context-menu" class="hidden">
    <div class="menu-item interactive" id="menu-edit-mode">편집 모드 (F2)</div>
    <div class="menu-sep"></div>
    <div class="menu-item interactive" id="menu-add-icon">아이콘 추가</div>
    <div class="menu-item interactive" id="menu-import">바탕화면 아이콘 가져오기</div>
    <div class="menu-sep"></div>
    <div class="menu-item interactive" id="menu-align-grid">그리드 정렬</div>
    <div class="menu-item interactive danger" id="menu-delete-selected">선택 삭제</div>
    <div class="menu-sep"></div>
    <div class="menu-item interactive" id="menu-set-background">배경 이미지 변경</div>
    <div class="menu-item interactive" id="menu-clear-background">배경 지우기</div>
    <div class="menu-sep"></div>
    <div class="menu-item interactive" id="menu-settings">설정</div>
    <div class="menu-item interactive danger" id="menu-clear-icons">아이콘 전체 삭제</div>
    <div class="menu-sep"></div>
    <div class="menu-item interactive danger" id="menu-quit">종료</div>
  </div>

  <!-- 아이콘 편집 모달 -->
  <div id="modal-backdrop" class="hidden">
    <div id="modal" class="interactive">
      <h2>아이콘 편집</h2>

      <div class="field">
        <label>이름</label>
        <input type="text" id="f-name" />
      </div>

      <div class="field">
        <label>이미지</label>
        <div class="image-row">
          <div id="f-image-preview"></div>
          <button id="f-image-pick">이미지 변경</button>
        </div>
      </div>

      <div id="f-target-fields">
        <div class="field">
          <label>실행 대상</label>
          <input type="text" id="f-target" placeholder="exe / 폴더 경로 또는 URL" />
        </div>

        <div class="field">
          <label>대상 종류</label>
          <select id="f-target-type">
            <option value="exe">프로그램 (exe)</option>
            <option value="folder">폴더</option>
            <option value="url">URL</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>아이콘 크기 (px)</label>
        <input type="number" id="f-size" min="32" max="256" step="8" />
      </div>

      <div class="field">
        <label>회전 (°)</label>
        <input type="number" id="f-rotation" min="-180" max="180" step="5" />
      </div>

      <div class="modal-buttons">
        <button id="btn-delete" class="danger">삭제</button>
        <span class="spacer"></span>
        <button id="btn-cancel">취소</button>
        <button id="btn-save" class="primary">저장</button>
      </div>
    </div>
  </div>

  <!-- 설정 모달 -->
  <div id="settings-backdrop" class="hidden">
    <div id="settings-modal" class="interactive">
      <h2>설정</h2>
      <div class="field">
        <label>편집 모드 단축키 (F1~F12)</label>
        <input type="text" id="s-hotkey" readonly placeholder="클릭 후 원하는 키를 누르세요" />
      </div>
      <div class="modal-buttons">
        <span class="spacer"></span>
        <button id="settings-cancel">취소</button>
        <button id="settings-save" class="primary">저장</button>
      </div>
    </div>
  </div>

  <!-- 폴더 그룹 드로어 (클릭 시 펼쳐지는 팝업) -->
  <div id="drawer" class="hidden"></div>

  <!-- 온보딩: 바탕화면 아이콘 가져오기 -->
  <div id="onboarding" class="hidden">
    <div id="onboarding-card" class="interactive">
      <h1>🎨 바탕화면 꾸미기 시작!</h1>
      <p>
        Windows 바탕화면에서 발견한 아이콘입니다. 자주 쓰는 것만 골라주세요.<br />
        선택하지 않은 아이콘은 <b>폴더 그룹</b> 하나에 깔끔하게 담아드려요.
      </p>
      <div class="ob-toolbar">
        <button id="ob-select-all">전체 선택</button>
        <button id="ob-select-none">전체 해제</button>
        <span id="ob-count"></span>
      </div>
      <div id="ob-list"></div>
      <div class="ob-buttons">
        <button id="ob-skip">건너뛰기</button>
        <span class="spacer"></span>
        <button id="ob-apply" class="primary">시작하기 ✨</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
